name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DB_URL: jdbc:mysql://127.0.0.1:3306/ocs?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true

jobs:
  backend:
    name: Backend (unit + MySQL/Redis integration tests, coverage)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ocs
          MYSQL_USER: ocs
          MYSQL_PASSWORD: ocs
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uocs -pocs"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    env:
      REDIS_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          def pct(m, c):
              miss = sum(int(r[m]) for r in rows); cov = sum(int(r[c]) for r in rows)
              return 100 * cov / (miss + cov)
          print(f"### Backend coverage\n\n| Lines | Branches |\n|---|---|\n"
                f"| {pct('LINE_MISSED','LINE_COVERED'):.1f}% | {pct('BRANCH_MISSED','BRANCH_COVERED'):.1f}% |")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

  frontend:
    name: Frontend (lint, type-check, build all zones)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: End-to-end (Playwright against the full stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ocs
          MYSQL_USER: ocs
          MYSQL_PASSWORD: ocs
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uocs -pocs"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Start API
        run: |
          cd backend && mvn -B -q package -DskipTests
          # All browser traffic reaches the API through the shell proxy (one IP), so the per-IP limiter is off,
          # as in docker-compose; rate limiting itself is covered by the backend tests.
          OCS_RATE_LIMIT_ENABLED=false nohup java -jar target/ocs-backend-1.0.0.jar > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
      - name: Build and start the five zones
        working-directory: frontend
        run: |
          npm ci && npm run build
          nohup npm start > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null localhost:3000/ && break; sleep 2; done
      - name: Run Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            api.log
            web.log

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t ocs-backend ./backend
      - name: Build frontend images (all zones)
        run: |
          for app in shell catalog learn studio admin; do
            docker build --build-arg APP=$app -t ocs-$app ./frontend
          done
