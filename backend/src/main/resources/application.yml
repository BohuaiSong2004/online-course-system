server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}   # "framework" only behind a trusted proxy/ALB

spring:
  application:
    name: ocs-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ocs?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8}
    username: ${DB_USER:ocs}
    password: ${DB_PASSWORD:ocs}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    # Schema is versioned with Flyway (db/migration). Demo data (db/demo) is applied once on an empty
    # database; real environments set OCS_FLYWAY_LOCATIONS=classpath:db/migration to leave it out.
    locations: ${OCS_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true                     # second-level (namespace) cache; see CourseMapper.xml
    default-statement-timeout: 10

ocs:
  jwt:
    secret: ${OCS_JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes}
    access-ttl-seconds: ${OCS_ACCESS_TTL:900}          # 15 min stateless access token
    refresh-ttl-seconds: ${OCS_REFRESH_TTL:1209600}    # 14 days rotating refresh token
    reuse-grace-seconds: ${OCS_REFRESH_GRACE:10}       # concurrent-refresh window before reuse = theft
    cookie-name: ocs_token
    refresh-cookie-name: ocs_refresh
    cookie-secure: ${OCS_COOKIE_SECURE:false}
  rate-limit:
    enabled: ${OCS_RATE_LIMIT_ENABLED:true}
    capacity: ${OCS_RATE_LIMIT_BURST:100}            # mirrors API Gateway burst_limit
    refill-per-second: ${OCS_RATE_LIMIT_RATE:50}     # mirrors API Gateway rate_limit
  cors:
    allowed-origins: ${OCS_CORS_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.bohuai.ocs.mapper: ${SQL_LOG_LEVEL:INFO}   # DEBUG prints SQL and cache hit ratios
